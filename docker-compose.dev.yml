# Local development only: Postgres + Redis. Run the API and worker with
# `npm run dev` / `npm run dev:worker` inside scissor-api against these.
# Host ports are non-default (6380 for Redis) to avoid clashing with other
# projects' containers already running on this machine.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scissor
      POSTGRES_PASSWORD: scissor
      POSTGRES_DB: scissor
    ports:
      - "5432:5432"
    volumes:
      - scissor_pg_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  scissor_pg_dev:
